<div class="relative">
  <app-page-header title="درخواست‌ها" subtitle="بررسی و مدیریت درخواست‌های کارکنان"></app-page-header>

  <!-- Tabs -->
  <div class="mb-5 flex items-center gap-1.5 overflow-x-auto border-b border-slate-200 pb-px">
    <button
      *ngFor="let tab of tabs"
      type="button"
      (click)="setTab(tab.value)"
      class="shrink-0 border-b-2 px-3.5 py-2.5 text-sm font-medium transition-colors"
      [ngClass]="activeTab() === tab.value
        ? 'border-blue-600 text-blue-600'
        : 'border-transparent text-slate-500 hover:text-slate-700'"
    >
      {{ tab.label }}
    </button>
  </div>

  <!-- Empty -->
  <app-empty-state
    *ngIf="filteredRequests().length === 0"
    title="درخواستی در این دسته وجود ندارد"
    description="با انتخاب یک دسته دیگر لیست را مشاهده کنید."
  ></app-empty-state>

  <!-- Request cards -->
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2" *ngIf="filteredRequests().length > 0">
    <div
      *ngFor="let req of filteredRequests()"
      class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm"
    >
      <div class="flex items-start justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-blue-50 text-xs font-bold text-blue-700">
            {{ req.avatarInitials }}
          </div>
          <div>
            <p class="text-sm font-semibold text-slate-800">{{ req.employeeName }}</p>
            <p class="text-xs text-slate-400">{{ req.typeLabel }}</p>
          </div>
        </div>
        <app-status-badge
          [label]="requestStatusMap[req.status].label"
          [tone]="requestStatusMap[req.status].tone"
        ></app-status-badge>
      </div>

      <p class="mt-3 line-clamp-2 text-sm text-slate-600">{{ req.description }}</p>
      <p class="mt-2 text-xs text-slate-400">{{ req.dateLabel }}</p>

      <div class="mt-4 flex items-center gap-2">
        <ng-container *ngIf="req.status === 'pending'; else viewOnly">
          <button
            type="button"
            (click)="approve(req)"
            class="flex-1 rounded-xl bg-emerald-600 py-2 text-xs font-semibold text-white transition-colors hover:bg-emerald-700"
          >
            تأیید
          </button>
          <button
            type="button"
            (click)="reject(req)"
            class="flex-1 rounded-xl bg-rose-50 py-2 text-xs font-semibold text-rose-600 transition-colors hover:bg-rose-100"
          >
            رد
          </button>
          <button
            type="button"
            (click)="viewDetails(req)"
            class="rounded-xl border border-slate-200 px-3 py-2 text-xs font-medium text-slate-600 hover:bg-slate-50"
          >
            جزئیات
          </button>
        </ng-container>
        <ng-template #viewOnly>
          <button
            type="button"
            (click)="viewDetails(req)"
            class="w-full rounded-xl border border-slate-200 py-2 text-xs font-medium text-slate-600 hover:bg-slate-50"
          >
            مشاهده جزئیات
          </button>
        </ng-template>
      </div>
    </div>
  </div>

  <!-- Toast (success) -->
  <div
    *ngIf="toastMessage()"
    class="pointer-events-none fixed inset-x-0 bottom-20 z-40 flex justify-center px-4 md:bottom-6"
  >
    <app-toast [message]="toastMessage()!" tone="success"></app-toast>
  </div>
</div>
