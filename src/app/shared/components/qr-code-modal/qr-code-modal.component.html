<div
  class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-slate-900/60 p-4 backdrop-blur-xs transition-opacity"
  dir="rtl"
>
  <!-- Modal Content Card -->
  <div
    class="relative w-full max-w-md transform overflow-hidden rounded-2xl bg-white p-6 text-right shadow-2xl transition-all border border-slate-100 animate-in fade-in zoom-in-95 duration-200"
  >
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
      <div class="flex items-center gap-2.5">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-50 text-blue-600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
        </div>
        <div>
          <h2 class="text-lg font-bold text-slate-800">QR کد محل کار</h2>
          <p class="text-xs text-slate-500">کد اختصاصی جهت حضور و غیاب پرسنل</p>
        </div>
      </div>
      <button
        type="button"
        (click)="onClose()"
        class="rounded-lg p-1.5 text-slate-400 transition hover:bg-slate-100 hover:text-slate-600"
        aria-label="بستن"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="my-6 flex flex-col items-center justify-center text-center">
      @if (isGenerating()) {
        <div class="flex h-64 w-64 flex-col items-center justify-center rounded-2xl border border-slate-200 bg-slate-50">
          <div class="h-8 w-8 animate-spin rounded-full border-3 border-blue-600 border-t-transparent"></div>
          <p class="mt-3 text-sm text-slate-500">در حال ساخت تصویر QR Code...</p>
        </div>
      } @else if (qrError()) {
        <div class="flex h-64 w-64 flex-col items-center justify-center rounded-2xl border border-rose-200 bg-rose-50 p-4">
          <svg class="h-10 w-10 text-rose-500 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <p class="text-xs font-semibold text-rose-700">{{ qrError() }}</p>
        </div>
      } @else if (qrDataUrl()) {
        <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <img
            [src]="qrDataUrl()"
            alt="QR Code"
            class="h-60 w-60 rounded-xl object-contain"
          />
        </div>
      }

      <!-- Expiration Notice -->
      <div class="mt-4 flex items-center justify-center gap-1.5 rounded-xl bg-amber-50 px-3.5 py-2 text-xs font-medium text-amber-800 border border-amber-200/60">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-600">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>اعتبار کد تا:</span>
        <span class="font-bold">{{ formattedExpiration() }}</span>
      </div>
    </div>

    <!-- Footer Action -->
    <div class="flex justify-end border-t border-slate-100 pt-4">
      <button
        type="button"
        (click)="onClose()"
        class="w-full rounded-xl bg-slate-800 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-900"
      >
        بستن
      </button>
    </div>
  </div>
</div>
