<div dir="rtl" lang="fa" class="system-admin-shell min-h-dvh bg-slate-50">
  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur-sm">
    <div class="mx-auto flex h-16 max-w-2xl items-center justify-between px-4 sm:px-6">
      <a routerLink="/system-admin/dashboard" class="flex items-center gap-2" aria-label="صفحه اصلی">
        <img src="/assets/logo/logo.png" alt="AriaHR" class="h-9 w-auto" width="90" height="36" />
      </a>
      <div class="flex items-center gap-2">
        <button type="button" class="relative grid h-10 w-10 place-items-center rounded-xl text-slate-500 transition hover:bg-slate-100" aria-label="اعلان‌ها">
          <span class="text-xl leading-none">♧</span>
          <span class="absolute right-2 top-2 h-2 w-2 rounded-full bg-blue-600 ring-2 ring-white"></span>
        </button>
        <div class="grid h-10 w-10 place-items-center rounded-full bg-blue-100 text-sm font-bold text-blue-700">{{ avatarInitial() }}</div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-2xl px-4 pb-28 pt-5 sm:px-6">
    <router-outlet />
  </main>

  <nav class="fixed inset-x-0 bottom-0 z-30 border-t border-slate-200 bg-white/95 pb-[env(safe-area-inset-bottom)] backdrop-blur-sm" aria-label="ناوبری اصلی">
    <div class="mx-auto grid h-[72px] max-w-2xl grid-cols-4 px-2">
      <a routerLink="/system-admin/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        <span class="nav-icon">⌂</span><span>خانه</span>
      </a>
      <a routerLink="/system-admin/centers" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">▣</span><span>مراکز</span>
      </a>
      <a routerLink="/system-admin/managers" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">♙</span><span>مدیران</span>
      </a>
      <a routerLink="/system-admin/settings" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">⚙</span><span>تنظیمات</span>
      </a>
    </div>
  </nav>
</div>
