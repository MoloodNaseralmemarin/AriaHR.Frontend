<div>
  <app-page-header title="شیفت‌ها" subtitle="مدیریت و مشاهده برنامه شیفت‌های مرکز">
    <a
      actions
      routerLink="/center-manager/shifts/create"
      class="inline-flex items-center gap-1.5 rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-blue-700"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      افزودن شیفت
    </a>
  </app-page-header>

  <!-- Toast Notification -->
  <app-toast
    *ngIf="toastMessage()"
    [message]="toastMessage()!"
    type="success"
    (close)="toastMessage.set(null)"
  ></app-toast>

  <!-- Loading State -->
  <div *ngIf="isLoading()" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <div *ngFor="let i of [1, 2, 3]" class="animate-pulse rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="flex items-center justify-between">
        <div class="h-5 w-32 rounded bg-slate-200"></div>
        <div class="h-6 w-16 rounded-full bg-slate-200"></div>
      </div>
      <div class="mt-4 flex items-center gap-2">
        <div class="h-4 w-16 rounded bg-slate-200"></div>
        <div class="h-0.5 w-6 bg-slate-200"></div>
        <div class="h-4 w-16 rounded bg-slate-200"></div>
      </div>
      <div class="mt-6 flex items-center justify-end gap-2 border-t border-slate-100 pt-3">
        <div class="h-8 w-20 rounded-xl bg-slate-200"></div>
      </div>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="!isLoading() && errorMessage()" class="my-6">
    <app-empty-state
      title="خطا در بارگذاری شیفت‌ها"
      [description]="errorMessage()!"
      actionLabel="تلاش مجدد"
      [isError]="true"
      (action)="loadShifts()"
    ></app-empty-state>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading() && !errorMessage() && shifts().length === 0" class="my-6">
    <app-empty-state
      title="هیچ شیفتی ثبت نشده است"
      description="می‌توانید نخستین شیفت کاری مرکز را تعریف کنید."
      actionLabel="افزودن شیفت"
      [isError]="false"
      (action)="onAddShift()"
    ></app-empty-state>
  </div>

  <!-- Shifts Grid -->
  <div
    *ngIf="!isLoading() && !errorMessage() && shifts().length > 0"
    class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
  >
    <div
      *ngFor="let shift of shifts()"
      class="flex flex-col justify-between rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:shadow-md"
    >
      <div>
        <div class="flex items-start justify-between gap-3">
          <h3 class="text-base font-bold text-slate-800">{{ shift.name }}</h3>
          <app-status-badge
            [label]="shift.isActive ? 'فعال' : 'غیرفعال'"
            [tone]="shift.isActive ? 'success' : 'neutral'"
          ></app-status-badge>
        </div>

        <div class="mt-4 flex items-center gap-2.5 text-sm font-semibold text-slate-700">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          <span dir="ltr" class="font-mono">{{ shift.startTime }}</span>
          <span class="h-0.5 w-4 bg-slate-300"></span>
          <span dir="ltr" class="font-mono">{{ shift.endTime }}</span>
        </div>
      </div>

      <!-- Actions Footer -->
      <div class="mt-6 flex items-center justify-end gap-2 border-t border-slate-100 pt-3">
        <a
          [routerLink]="['/center-manager/shifts', shift.id, 'edit']"
          class="inline-flex items-center gap-1 rounded-xl px-3 py-1.5 text-xs font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-800"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          ویرایش
        </a>

        <button
          type="button"
          (click)="toggleStatus(shift)"
          [disabled]="togglingId() === shift.id"
          class="inline-flex items-center gap-1 rounded-xl px-3 py-1.5 text-xs font-medium transition-colors disabled:opacity-50"
          [ngClass]="shift.isActive
            ? 'text-rose-600 hover:bg-rose-50'
            : 'text-emerald-600 hover:bg-emerald-50'"
        >
          <span *ngIf="togglingId() === shift.id" class="h-3 w-3 animate-spin rounded-full border-2 border-current border-t-transparent"></span>
          {{ shift.isActive ? 'غیرفعال‌سازی' : 'فعال‌سازی' }}
        </button>
      </div>
    </div>
  </div>
</div>
