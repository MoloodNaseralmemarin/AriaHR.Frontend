@if (toastService.toast(); as t) {
  <div
    dir="rtl"
    lang="fa"
    class="fixed inset-x-0 bottom-6 z-50 flex justify-center px-4 pointer-events-none"
  >
    <div
      role="status"
      aria-live="polite"
      class="pointer-events-auto flex items-center gap-2 max-w-sm rounded-xl px-4 py-2.5 shadow-lg text-sm font-medium
             transition-all duration-200 ease-out"
      [class.opacity-0]="!toastService.visible()"
      [class.translate-y-1]="!toastService.visible()"
      [class.opacity-100]="toastService.visible()"
      [class.translate-y-0]="toastService.visible()"
      [class.bg-emerald-600]="t.type === 'success'"
      [class.bg-red-600]="t.type === 'error'"
      [class.text-white]="true"
    >
      @if (t.type === 'success') {
        <span
          class="flex-shrink-0 h-4 w-4 rounded-full bg-white/25 text-[10px] flex items-center justify-center"
          aria-hidden="true"
        >✓</span>
      } @else {
        <span
          class="flex-shrink-0 h-4 w-4 rounded-full bg-white/25 text-[10px] flex items-center justify-center"
          aria-hidden="true"
        >!</span>
      }
      <span>{{ t.message }}</span>
    </div>
  </div>
}
