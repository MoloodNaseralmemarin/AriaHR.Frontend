<section class="space-y-5"><a routerLink="/system-admin/centers" class="back">→ بازگشت</a><div><p class="eyebrow">مرحله {{ step() }} از ۲</p><h1>{{ step() === 1 ? 'ثبت مرکز جدید' : 'اطلاعات مدیر مرکز' }}</h1><p class="subtitle">{{ step() === 1 ? 'اطلاعات اصلی مرکز را وارد کنید' : 'مدیر این مرکز را مشخص کنید' }}</p></div><div class="progress"><span [class.done]="step() >= 1"></span><span [class.done]="step() >= 2"></span></div><form (ngSubmit)="next()" class="form-card">@if(step()===1){<label>نام مرکز<input name="centerName" [(ngModel)]="form.centerName" required placeholder="مثلاً کلینیک آریا" /></label><label>نوع مرکز<select name="centerType" [(ngModel)]="form.centerType" required><option value="">انتخاب کنید</option><option>کلینیک</option><option>مرکز درمانی</option><option>مرکز تصویربرداری</option></select></label><label>آدرس مرکز<textarea name="address" [(ngModel)]="form.address" rows="3" placeholder="آدرس کامل مرکز"></textarea></label><label>شماره تماس<input name="phone" [(ngModel)]="form.phone" inputmode="tel" placeholder="021-12345678" /></label>}@else{<label>نام و نام خانوادگی مدیر<input name="managerName" [(ngModel)]="form.managerName" required placeholder="نام مدیر مرکز" /></label><label>شماره موبایل مدیر<input name="managerMobile" [(ngModel)]="form.managerMobile" inputmode="tel" required placeholder="0912•••••••" /></label><label>ایمیل مدیر<input name="managerEmail" [(ngModel)]="form.managerEmail" type="email" placeholder="manager@example.com" /></label>}<button class="submit" type="submit" [disabled]="saving()">{{ saving() ? 'در حال ثبت...' : step() === 1 ? 'ادامه' : 'ثبت مرکز و مدیر' }} <span>←</span></button></form></section>
