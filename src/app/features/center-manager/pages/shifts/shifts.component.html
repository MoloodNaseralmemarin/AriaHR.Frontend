<div>
  <app-page-header title="شیفت‌ها" subtitle="مدیریت و مشاهده برنامه شیفت‌های مرکز">
    <button
      actions
      type="button"
      (click)="onAddShift()"
      class="inline-flex items-center gap-1.5 rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-blue-700"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      افزودن شیفت
    </button>
  </app-page-header>

  <!-- Date selector -->
  <div class="mb-6 flex items-center gap-2 overflow-x-auto rounded-2xl border border-slate-200 bg-white p-2">
    <button
      *ngFor="let day of days; index as i"
      type="button"
      (click)="selectDay(i)"
      class="flex w-14 shrink-0 flex-col items-center gap-1 rounded-xl py-2.5 text-sm transition-colors"
      [ngClass]="selectedDayIndex() === i
        ? 'bg-blue-600 text-white'
        : 'text-slate-500 hover:bg-slate-50'"
    >
      <span class="text-[11px]">{{ day.label }}</span>
      <span class="font-bold">{{ day.date }}</span>
    </button>
  </div>

  <!-- Today's shifts -->
  <section class="mb-6">
    <h2 class="mb-3 text-sm font-semibold text-slate-500">شیفت‌های امروز</h2>
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      <div
        *ngFor="let shift of todayShifts"
        class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm"
      >
        <div class="flex items-start justify-between gap-2">
          <div class="flex items-center gap-2 text-base font-bold text-slate-800">
            <span dir="ltr">{{ shift.startTime }}</span>
            <span class="h-px w-8 bg-slate-300"></span>
            <span dir="ltr">{{ shift.endTime }}</span>
          </div>
          <app-status-badge
            [label]="shiftStatusMap[shift.status].label"
            [tone]="shiftStatusMap[shift.status].tone"
          ></app-status-badge>
        </div>

        <div class="mt-3 flex items-center gap-4 text-xs text-slate-500">
          <span class="inline-flex items-center gap-1">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            {{ shift.plannedCount }} نفر برنامه‌ریزی شده
          </span>
          <span *ngIf="shift.presentCount > 0" class="inline-flex items-center gap-1 text-emerald-600">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/></svg>
            {{ shift.presentCount }} نفر حاضر
          </span>
        </div>

        <div class="mt-3 flex -space-x-2 space-x-reverse">
          <div
            *ngFor="let name of shift.assignedEmployeeNames"
            class="flex h-7 w-7 items-center justify-center rounded-full border-2 border-white bg-blue-50 text-[10px] font-bold text-blue-700"
            [title]="name"
          >
            {{ name.charAt(0) }}
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Upcoming shifts -->
  <section>
    <h2 class="mb-3 text-sm font-semibold text-slate-500">شیفت‌های آینده</h2>
    <div class="space-y-3">
      <div
        *ngFor="let shift of upcomingShifts"
        class="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-200 bg-white p-4"
      >
        <div>
          <p class="text-xs text-slate-400">{{ shift.dateLabel }}</p>
          <div class="mt-1 flex items-center gap-2 text-sm font-semibold text-slate-700">
            <span dir="ltr">{{ shift.startTime }}</span>
            <span class="h-px w-6 bg-slate-300"></span>
            <span dir="ltr">{{ shift.endTime }}</span>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-xs text-slate-500">{{ shift.plannedCount }} نفر</span>
          <app-status-badge
            [label]="shiftStatusMap[shift.status].label"
            [tone]="shiftStatusMap[shift.status].tone"
          ></app-status-badge>
        </div>
      </div>
    </div>
  </section>
</div>
