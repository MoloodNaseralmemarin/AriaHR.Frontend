<div class="relative">
  <app-page-header title="تنظیمات مرکز" subtitle="مدیریت اطلاعات، ساعات کاری و اعلان‌های مرکز">
    <button
      actions
      type="button"
      (click)="onSave()"
      class="inline-flex items-center gap-1.5 rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-blue-700"
    >
      ذخیره تغییرات
    </button>
  </app-page-header>

  <div class="space-y-5">
    <!-- Center Information -->
    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="mb-4 text-sm font-semibold text-slate-700">اطلاعات مرکز</h2>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <label class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-500">نام مرکز</span>
          <input
            type="text"
            [ngModel]="centerName()"
            (ngModelChange)="centerName.set($event)"
            class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-100"
          />
        </label>

        <label class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-500">نوع مرکز</span>
          <select
            [ngModel]="centerType()"
            (ngModelChange)="centerType.set($event)"
            class="w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm text-slate-700 focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-100"
          >
            <option *ngFor="let type of centerTypeOptions" [value]="type">{{ type }}</option>
          </select>
        </label>

        <label class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-500">شماره تماس</span>
          <input
            type="tel"
            dir="ltr"
            [ngModel]="phoneNumber()"
            (ngModelChange)="phoneNumber.set($event)"
            class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-end text-sm text-slate-700 focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-100"
          />
        </label>

        <label class="block sm:col-span-2">
          <span class="mb-1.5 block text-xs font-medium text-slate-500">آدرس</span>
          <textarea
            rows="2"
            [ngModel]="address()"
            (ngModelChange)="address.set($event)"
            class="w-full resize-none rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-100"
          ></textarea>
        </label>
      </div>
    </section>

    <!-- Work Settings -->
    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="mb-4 text-sm font-semibold text-slate-700">تنظیمات کاری</h2>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <label class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-500">محدوده جغرافیایی حضور (متر)</span>
          <input
            type="number"
            [ngModel]="geoRadius()"
            (ngModelChange)="geoRadius.set($event)"
            class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-100"
          />
        </label>

        <label class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-500">مهلت مجاز تأخیر (دقیقه)</span>
          <input
            type="number"
            [ngModel]="attendanceGraceMinutes()"
            (ngModelChange)="attendanceGraceMinutes.set($event)"
            class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-100"
          />
        </label>

        <label class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-500">ساعت شروع کاری</span>
          <input
            type="time"
            dir="ltr"
            [ngModel]="workStart()"
            (ngModelChange)="workStart.set($event)"
            class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-end text-sm text-slate-700 focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-100"
          />
        </label>

        <label class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-500">ساعت پایان کاری</span>
          <input
            type="time"
            dir="ltr"
            [ngModel]="workEnd()"
            (ngModelChange)="workEnd.set($event)"
            class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-end text-sm text-slate-700 focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-100"
          />
        </label>
      </div>
    </section>

    <!-- Notification Settings -->
    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="mb-4 text-sm font-semibold text-slate-700">تنظیمات اعلان‌ها</h2>
      <div class="divide-y divide-slate-100">
        <div class="flex items-center justify-between py-3">
          <div>
            <p class="text-sm font-medium text-slate-700">اعلان درخواست‌ها</p>
            <p class="mt-0.5 text-xs text-slate-400">دریافت اعلان هنگام ثبت درخواست جدید</p>
          </div>
          <button
            type="button"
            role="switch"
            [attr.aria-checked]="notifyRequests()"
            (click)="toggle('notifyRequests')"
            class="relative h-6 w-11 shrink-0 rounded-full transition-colors"
            [ngClass]="notifyRequests() ? 'bg-blue-600' : 'bg-slate-200'"
          >
            <span
              class="absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform"
              [ngClass]="notifyRequests() ? 'right-0.5' : 'right-5'"
            ></span>
          </button>
        </div>

        <div class="flex items-center justify-between py-3">
          <div>
            <p class="text-sm font-medium text-slate-700">اعلان غیبت</p>
            <p class="mt-0.5 text-xs text-slate-400">دریافت اعلان در صورت غیبت کارمند</p>
          </div>
          <button
            type="button"
            role="switch"
            [attr.aria-checked]="notifyAbsence()"
            (click)="toggle('notifyAbsence')"
            class="relative h-6 w-11 shrink-0 rounded-full transition-colors"
            [ngClass]="notifyAbsence() ? 'bg-blue-600' : 'bg-slate-200'"
          >
            <span
              class="absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform"
              [ngClass]="notifyAbsence() ? 'right-0.5' : 'right-5'"
            ></span>
          </button>
        </div>

        <div class="flex items-center justify-between py-3">
          <div>
            <p class="text-sm font-medium text-slate-700">اعلان تأخیر</p>
            <p class="mt-0.5 text-xs text-slate-400">دریافت اعلان در صورت تأخیر کارمند</p>
          </div>
          <button
            type="button"
            role="switch"
            [attr.aria-checked]="notifyLate()"
            (click)="toggle('notifyLate')"
            class="relative h-6 w-11 shrink-0 rounded-full transition-colors"
            [ngClass]="notifyLate() ? 'bg-blue-600' : 'bg-slate-200'"
          >
            <span
              class="absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform"
              [ngClass]="notifyLate() ? 'right-0.5' : 'right-5'"
            ></span>
          </button>
        </div>
      </div>
    </section>
  </div>

  <!-- Success toast -->
  <div
    *ngIf="showSavedToast()"
    class="pointer-events-none fixed inset-x-0 bottom-20 z-40 flex justify-center px-4 md:bottom-6"
  >
    <app-toast message="تغییرات با موفقیت ذخیره شد." tone="success"></app-toast>
  </div>
</div>
