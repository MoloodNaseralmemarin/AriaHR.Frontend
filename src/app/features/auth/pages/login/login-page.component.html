<main
  dir="rtl"
  lang="fa"
  class="min-h-dvh w-full bg-slate-100 flex flex-col items-center justify-center px-4 py-10 sm:py-16"
>
  <div class="w-full max-w-sm mx-auto flex flex-col items-center animate-page-in">

    <!-- Logo -->
    <div class="mb-6 flex items-center justify-center p-3 bg-white rounded-2xl shadow-xs ring-1 ring-slate-200">
      <img
        src="/assets/logo/logo.png"
        alt="AriaHR"
        class="h-10 w-auto select-none"
      />
    </div>

    <!-- Branding -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-900 leading-snug">
        حضور و غیاب هوشمند
      </h1>
      <p class="mt-1 text-sm font-medium text-slate-600 leading-relaxed">
        سامانه هوشمند مدیریت پرسنل
      </p>
    </div>

    <!-- Card -->
    <section
      class="w-full bg-white rounded-2xl shadow-md border border-slate-200 p-6 sm:p-7 animate-card-in"
      aria-label="ورود به سامانه"
    >
      <form (ngSubmit)="onSubmit()" novalidate class="flex flex-col gap-5">

        <div class="flex flex-col gap-2">
          <label for="mobileNumber" class="text-sm font-semibold text-slate-800">
            شماره موبایل
          </label>

          <input
            id="mobileNumber"
            name="mobileNumber"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            dir="rtl"
            placeholder="مثال: ۰۹۱۲۳۴۵۶۷۸۹"
            maxlength="11"
            [ngModel]="mobileNumberInput()"
            (ngModelChange)="onMobileInputChange($event)"
            (blur)="onBlur()"
            [attr.aria-invalid]="showValidationError()"
            [attr.aria-describedby]="showValidationError() ? 'mobileNumber-error' : null"
            class="w-full h-12 px-4 rounded-xl border bg-slate-50 text-slate-900 font-medium text-base tracking-wide
                   placeholder:text-slate-400 placeholder:text-sm
                   transition-colors duration-150
                   focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600
                   disabled:bg-slate-100 disabled:text-slate-400"
            [class.border-slate-300]="!showValidationError()"
            [class.border-rose-500]="showValidationError()"
            [disabled]="submitState() === 'loading'"
          />

          <!-- Validation message -->
          @if (showValidationError()) {
            <p
              id="mobileNumber-error"
              role="alert"
              class="text-xs font-medium text-rose-600 mt-0.5 animate-msg-in"
            >
              {{ validationMessage() }}
            </p>
          }
        </div>

        <!-- Submit button -->
        <button
          type="submit"
          [disabled]="isSubmitDisabled()"
          class="relative h-12 w-full rounded-xl font-bold text-sm text-white
                 bg-blue-600 shadow-sm transition-all duration-150
                 hover:bg-blue-700 active:bg-blue-800 active:scale-[0.99]
                 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2
                 disabled:bg-slate-300 disabled:text-slate-500 disabled:cursor-not-allowed disabled:active:scale-100"
        >
          @if (submitState() === 'loading') {
            <span class="inline-flex items-center justify-center gap-2">
              <span
                class="h-4 w-4 rounded-full border-2 border-white/40 border-t-white animate-spin"
                aria-hidden="true"
              ></span>
              <span>در حال ارسال...</span>
            </span>
          } @else {
            <span>دریافت کد تایید</span>
          }
        </button>

        <!-- Success message -->
        @if (submitState() === 'success') {
          <p
            role="status"
            class="flex items-center gap-2 text-sm font-medium text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-xl px-3.5 py-2.5 animate-msg-in"
          >
            <span
              class="flex-shrink-0 h-4 w-4 rounded-full bg-emerald-600 text-white text-[10px] flex items-center justify-center font-bold"
              aria-hidden="true"
            >✓</span>
            کد تایید با موفقیت ارسال شد.
          </p>
        }

        <!-- Error message -->
        @if (submitState() === 'error') {
          <p
            role="alert"
            class="flex items-center gap-2 text-sm font-medium text-rose-800 bg-rose-50 border border-rose-200 rounded-xl px-3.5 py-2.5 animate-msg-in"
          >
            <span
              class="flex-shrink-0 h-4 w-4 rounded-full bg-rose-600 text-white text-[10px] flex items-center justify-center font-bold"
              aria-hidden="true"
            >!</span>
            ارسال کد تایید با خطا مواجه شد. لطفاً دوباره تلاش کنید.
          </p>
        }
      </form>
    </section>
  </div>
</main>
