<!--
  Splash Screen — AriaHR
  Only the logo is rendered. No text, no subtitle, no loading indicator.
  Layout is direction-agnostic (works for RTL/LTR) since flex centering
  does not depend on text direction.
-->
<main
  class="min-h-screen min-h-[100dvh] w-full flex items-center justify-center bg-white px-6"
>
  <img
    src="assets/images/logo.svg"
    alt="AriaHR"
    class="splash-logo w-32 sm:w-36 md:w-40 h-auto select-none"
    draggable="false"
  />
</main>
